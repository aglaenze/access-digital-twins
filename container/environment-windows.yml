# Conda environment of the twins for a native installation on Windows (see ../TUTORIAL.md, route B).
# Same versions as environment-mcstas.yml (the container); on Windows, McStas compiles with Visual Studio
# (install "Build Tools for Visual Studio", workload "Desktop development with C++") and runs in parallel with MS-MPI.
name: twins
channels:
  - conda-forge
  - nodefaults
dependencies:
  - python=3.14
  - mcstas=3.9.2
  - mcstasscript=0.0.91
  - ncrystal=4.4.6
  - mcpl=2.2.8
  - msmpi                # mpiexec for McStas (MPI)
  - numpy=2.5
  - scipy=1.18
  - h5py=3.16
  - hdf5=1.14.6
  - scipp=26.9.0
  - scippneutron=26.10.0
  - scippnexus=26.1.1
  - tof=26.9.0
  - plopp=26.9.0
  - mcstastox=0.0.12
  - pooch
  - ipywidgets=8.1.9
  - ipympl=0.10.0
  - jupyterlab=4.6
  - nbformat
  - git
  - pip
  - pip:
      - matplotlib==3.11.1
      - essimaging==26.10.1
      - essreduce==26.10.1
      - sciline==26.9.0
      - voila==0.5.13

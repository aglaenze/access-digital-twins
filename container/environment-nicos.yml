# Conda environment of NICOS (cache, poller, daemon): NICOS needs numpy < 2, the twins numpy 2, hence two
# environments that talk over HTTP (twin_server.py). The NICOS Python requirements (requirements.txt of the NICOS
# sources, including nicos-pyctl from the FRM II package index) are installed by the Containerfile.
# No GUI in the container (no PyQt): students connect with a NICOS client, or use the web pages.
name: nicos
channels:
  - conda-forge
  - nodefaults
dependencies:
  - python=3.12
  - numpy=1.26
  - c-compiler          # in case nicos-pyctl has no wheel for this platform
  - pip

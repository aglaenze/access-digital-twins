# One exercise of the catalogue of the app (read by container/twin_app.py: no generation needed).
# Paths are relative to the root of the repository.
title: How big are these nanoparticles?
instrument: loki
technique: Small-angle neutron scattering (SANS)
sample: Silica spheres in heavy water (D2O), 1 % by volume
question: >-
  Measure the small-angle scattering of silica nanoparticles in D2O, subtract the solvent, and find the size of the
  particles (Guinier analysis, then a sphere model).
learn: SANS measurement (sample, solvent, empty beam), reduction to I(Q) in absolute units, Guinier law, form factors.
mission: >-
  You make silica nanoparticles for medical imaging. A new batch must have a radius between 4.5 and 5.5 nm. Measure the average size of the billions of particles of the batch, in the liquid, and decide whether it can be released.
status: ready
# samples of the library used by the exercise (loki/samples/*.yml); hidden: properties not shown to the students
# (what they have to measure)
samples:
  silica_spheres: {hidden: [radius, volume_fraction]}
  d2o: {}
  empty_beam: {}
modes:
  bsc:
    label: Guided web page
    what: Settings given and explained, the three measurements a SANS experiment needs, I(Q) and the particle size. No code.
    duration: 2 hours
    open: voila
    file: loki/LoKI_virtual.ipynb
  msc:
    label: Notebook with a model builder
    what: >-
      You measure in NICOS (the commands are given); the reduction with the ESS software (esssans) is given; you develop
      the Guinier analysis and choose a shape with sasmodels (the engine of SasView) in model builders (no code to
      write), checked automatically.
    duration: half a day
    open: lab
    file: loki/exercises/silica_spheres/LoKI_silica_msc.ipynb
  beamtime:
    label: Beamtime with NICOS
    what: >-
      A proposal and a beamtime budget. You drive LoKI in NICOS (collimation, detector distance, counting times),
      choose the measurements yourself, then analyze your files with a starter notebook.
    duration: 1 day
    open: lab
    file: loki/exercises/silica_spheres/beamtime.md
    nicos: loki
    analysis: loki/exercises/silica_spheres/LoKI_silica_beamtime.ipynb
    # the proposal of this beamtime, in the user office of the twin (user_office.py): Find my proposal in the Experiment tab
    # of NICOS; its samples are those of the exercise, the first one mounted by default
    proposal: {id: "3001", title: "Size of silica nanoparticles for a new polishing slurry"}

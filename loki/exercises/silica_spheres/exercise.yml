# One exercise of the catalogue of the app (read by container/twin_app.py: no generation needed).
# Paths are relative to the root of the repository.
title: How big are these nanoparticles?
short: Nanoparticles for the blades               # the name of its node on the map of the catalogue
instrument: loki
# its place in the story (STORY.md): the thread (column of the catalogue) and the client
story: {thread: energy, client: "Fyrø · Structures (blades)"}
technique: Small-angle neutron scattering (SANS)
sample: Silica spheres in heavy water (D2O), 1 % by volume
question: >-
  Measure the small-angle scattering of silica nanoparticles in D2O, subtract the solvent, and find the size of the
  particles (Guinier analysis, then a sphere model).
learn: SANS measurement (sample, solvent, empty beam), reduction to I(Q) in absolute units, Guinier law, form factors.
mission: >-
  The epoxy of Fyrø's turbine blades is toughened with silica nanoparticles. A new batch must have a radius between 4.5
  and 5.5 nm. Measure the average size of the billions of particles of the batch, in the liquid, and decide whether it can be released.
status: ready
# samples of the library used by the exercise (loki/samples/*.yml); hidden: properties not shown to the students
# (what they have to measure)
samples:
  silica_spheres: {hidden: [radius, volume_fraction]}
  d2o: {}
  empty_beam: {}
modes:
  bsc:
    label: Guided web page
    what: Settings given, the three measurements of a SANS experiment, I(Q) and the size.
    mission: >-
      Fyrø toughens the epoxy of its turbine blades with silica nanoparticles. Tomas has set up LoKI: measure a new
      batch and decide whether it can be released.
    duration: 2 hours
    open: voila
    file: loki/LoKI_virtual.ipynb
  msc:
    label: Notebook with a model builder
    what: Measure in NICOS, then fit I(Q) with a Guinier law and a shape in model builders.
    mission: >-
      Fyrø will check every batch of nanoparticles for its blades: build the analysis, from the files to the radius
      with its uncertainty.
    duration: 3 hours
    open: lab
    file: loki/exercises/silica_spheres/LoKI_silica_msc.ipynb
  beamtime:
    label: Beamtime with NICOS
    what: Drive LoKI in NICOS, choose your own measurements, analyze your files.
    mission: >-
      Your proposal was accepted: plan and run the SANS beamtime yourself, and give Fyrø the size of the particles
      with its uncertainty.
    duration: 1 day
    open: lab
    file: loki/exercises/silica_spheres/beamtime.md
    nicos: loki
    analysis: loki/exercises/silica_spheres/LoKI_silica_beamtime.ipynb
    # the proposal of this beamtime, in the user office of the twin (user_office.py): Find my proposal in the Experiment tab
    # of NICOS; its samples are those of the exercise, the first one mounted by default
    proposal: {id: "3001", title: "Size of silica nanoparticles for toughened turbine-blade epoxy"}

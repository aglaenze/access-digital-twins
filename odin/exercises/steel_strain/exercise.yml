# One exercise of the catalogue of the app (read by container/twin_app.py: no generation needed).
# Paths are relative to the root of the repository.
title: Where is a loaded steel part strained?
short: Steel under load               # the name of its node on the map of the catalogue
number: "3"                  # theme 3 of ODIN: Bragg-edge strain mapping with the resolution of WFM
instrument: odin
# its place in the story (STORY.md): the thread (column of the catalogue) and the client
story: {thread: energy, client: "Fyrø · Structures"}
technique: Bragg-edge strain mapping (WFM)
sample: The tensile specimen of austenitic stainless steel measured at V20 (HZB, 2018), in a load frame
question: >-
  Measure the shift of a Bragg edge of a steel specimen under load, and deduce the strain of its crystal lattice in
  its narrow middle and its wide ends, as at V20 (HZB) in 2018.
learn: Bragg edges, lattice strain, stress and Hooke's law, Poisson's ratio, fitting an edge, counting statistics.
mission: >-
  Fyrø's structures department comes back: a stainless steel part of the turbines carries a large force. Where,
  inside the steel, is the material strained, and by how much? Neutrons see the distance between the planes of atoms
  through the steel: measure a specimen under load and tell Fyrø whether the steel behaves as designed.
status: ready
samples:
  steel_tensile: {}
modes:
  bsc:
    label: Guided web page
    what: Settings given, one button to count, the edge fitted for you, a strain map and questions.
    mission: >-
      A steel part of Fyrø's turbines carries a large force. Maja has set up ODIN and the load frame: find the strain
      in the middle and the ends; does the steel behave as designed?
    duration: 2 hours
    open: voila
    file: odin/exercises/steel_strain/ODIN_steel_strain.ipynb
  msc:
    label: Notebook with a model builder
    what: Build the model of the edge, map the strain, find Poisson's ratio.
    mission: >-
      Fyrø needs a method to measure the lattice strain inside its steel under load: build it, with its systematic
      errors, and find Poisson's ratio.
    duration: 3 hours
    open: lab
    file: odin/exercises/steel_strain/ODIN_steel_msc.ipynb
  beamtime:
    label: Beamtime with NICOS
    what: Drive ODIN and its load frame in NICOS, choose your measurements, analyze your files.
    mission: >-
      Your proposal was accepted: plan and run the beamtime with the load frame yourself, and show Fyrø how well ODIN
      measures strain inside its steel.
    duration: 1 day
    open: lab
    file: odin/exercises/steel_strain/beamtime.md
    nicos: odin
    analysis: odin/exercises/steel_strain/ODIN_steel_beamtime.ipynb
    proposal: {id: "1240", title: "Lattice strain of a steel specimen under load by Bragg-edge imaging"}
reference: >-
  V20 measurement of September 2018 (P. Kadletz), public data scipp/ess-notebooks-data (imaging/bragg-edge-imaging-2D);
  V20: R. Woracek et al., Nucl. Instrum. Methods A 839, 102 (2016).

# One exercise of the catalogue of the app (read by container/twin_app.py: no generation needed).
# Paths are relative to the root of the repository.
title: How does lithium enter a battery electrode?
short: A thicker battery               # the name of its node on the map of the catalogue
number: "2"                  # theme 2 of ODIN: fast, operando imaging
instrument: odin
# its place in the story (STORY.md): the thread (column of the catalogue) and the client
story: {thread: energy, client: "Fyrø · Storage"}
technique: Operando white-beam imaging
sample: >-
  The lithium half-cell with an ultra-thick (0.4 mm) graphite electrode of Strobl et al. (SENJU, J-PARC, 2025), on its
  cycler
question: >-
  Film a battery cell during a whole charge cycle and map, through the depth of the electrode, where the lithium goes,
  when, and how much of it is lost.
learn: Neutron contrast of lithium, operando imaging, reference images, attenuation profiles, intercalation, SEI.
mission: >-
  Fyrø Energy Island stores the wind power of calm days in batteries. Thicker electrodes would store more energy,
  but does the lithium reach their far side, and how much is lost in the first cycle? Watch the lithium move inside a working cell.
status: ready
samples:
  battery_graphite: {}
modes:
  bsc:
    label: Guided web page
    what: Settings given, one button to film the cycle, the lithium profiles and questions.
    mission: >-
      Fyrø's storage department tests ultra-thick electrodes. Maja has set up ODIN: film a whole cycle, read the
      lithium profiles, and answer Fyrø.
    duration: 2 hours
    open: voila
    file: odin/exercises/battery_operando/ODIN_battery.ipynb
  msc:
    label: Notebook with method choices
    what: Choose the reference image, the width averaged and how to convert into lithium.
    mission: >-
      Fyrø will compare electrodes from several suppliers: build a method from the raw images to lithium amounts
      comparable with the charge of the cycler.
    duration: 3 hours
    open: lab
    file: odin/exercises/battery_operando/ODIN_battery_msc.ipynb
  beamtime:
    label: Beamtime with NICOS
    what: Drive ODIN and the cycler in NICOS, choose your measurements, analyze your files.
    mission: >-
      Your proposal was accepted: plan and run the operando beamtime yourself, and tell Fyrø whether a 0.4 mm
      electrode fills up and how much lithium it loses.
    duration: 1 day
    open: lab
    file: odin/exercises/battery_operando/beamtime.md
    nicos: odin
    analysis: odin/exercises/battery_operando/ODIN_battery_beamtime.ipynb
    proposal: {id: "1260", title: "Operando imaging of lithium in an ultra-thick graphite electrode"}
reference: >-
  M. Strobl, M. E. Baur et al., Adv. Energy Mater. (2025), SENJU (J-PARC); M.-E. Lăcătuşu, L. Theil Kuhn et al.,
  arXiv:2104.03564 (2021).

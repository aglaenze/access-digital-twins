# One exercise of the catalogue of the app (read by container/twin_app.py: no generation needed).
# Paths are relative to the root of the repository.
title: How far apart are the atoms in iron?
instrument: odin
technique: Wavelength-resolved imaging (Bragg edges)
sample: Iron plate, 5 mm (alpha-iron, body-centered cubic)
question: >-
  Measure the transmission of an iron plate as a function of the neutron wavelength, find its Bragg edges and deduce
  the spacing of the atomic planes.
learn: Time of flight, transmission (dark, open beam, sample), Bragg's law, counting statistics, fitting.
mission: >-
  You are a materials engineer. A supplier has delivered plates sold as ferritic steel (alpha-iron); a mix-up with austenitic steel would matter for your parts, and you may not cut them. Neutrons see the crystal structure through the steel: give your verdict.
status: ready
# samples of the library used by the exercise (odin/samples/*.yml); hidden: properties not shown to the students
samples:
  iron_plate: {}
modes:
  bsc:
    label: Guided web page
    what: Settings given and explained, a Measure button, plots and questions. No code.
    duration: 2 hours
    open: voila
    file: odin/ODIN_virtual.ipynb
  msc:
    label: Notebook with tasks
    what: >-
      You measure in NICOS (the commands are given), then analyze in code: the reduction with the ESS software is given, you
      write the Bragg-edge model and the fit, an automatic check tells you if your result is right.
    duration: half a day
    open: lab
    file: odin/exercises/iron_bragg_edges/ODIN_iron_msc.ipynb
  beamtime:
    label: Beamtime with NICOS
    what: >-
      A proposal and a beamtime budget. You drive ODIN in NICOS, choose the measurements yourself, then analyze your
      files with a starter notebook. No settings are given.
    duration: 1 day
    open: lab
    file: odin/exercises/iron_bragg_edges/beamtime.md
    nicos: odin
    analysis: odin/exercises/iron_bragg_edges/ODIN_iron_beamtime.ipynb
    # the proposal of this beamtime, in the user office of the twin (user_office.py): Find my proposal in the Experiment tab
    # of NICOS; its samples are those of the exercise, the first one mounted by default
    proposal: {id: "1234", title: "Lattice spacing of a ferritic steel component by Bragg-edge imaging"}

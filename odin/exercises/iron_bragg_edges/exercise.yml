# One exercise of the catalogue of the app (read by container/twin_app.py: no generation needed).
# Paths are relative to the root of the repository.
title: How far apart are the atoms in iron?
short: Steel for the foundations               # the name of its node on the map of the catalogue
number: "0"                  # place in the catalogue: 0 = the first exercise (a simple sample: the iron plate)
instrument: odin
# its place in the story (STORY.md): the thread (column of the catalogue) and the client
story: {thread: energy, client: "Fyrø · Structures"}
technique: Wavelength-resolved imaging (Bragg edges)
sample: Iron plate, 5 mm (alpha-iron, body-centered cubic)
question: >-
  Measure the transmission of an iron plate as a function of the neutron wavelength, find its Bragg edges and deduce
  the spacing of the atomic planes.
learn: Time of flight, transmission (dark, open beam, sample), Bragg's law, counting statistics, fitting.
mission: >-
  Fyrø Energy Island has received steel plates for the foundations of its wind turbines, sold as ferritic steel
  (alpha-iron). A mix-up with austenitic steel would matter, and the plates may not be cut. Neutrons see the crystal
  structure through the steel: give your verdict.
status: ready
# samples of the library used by the exercise (odin/samples/*.yml); hidden: properties not shown to the students
samples:
  iron_plate: {}
modes:
  bsc:
    label: Guided web page
    what: Settings given, one button to measure, plots and questions.
    # the mission of the card at this level (STORY.md): the same client, the student's grade in the team
    mission: >-
      Fyrø has received steel plates for its turbine foundations, sold as ferritic steel (alpha-iron); they may not be
      cut. Maja has set up ODIN for you: alpha-iron or not, and with which lattice parameter?
    duration: 2 hours
    open: voila
    file: odin/ODIN_virtual.ipynb
  msc:
    label: Notebook with a model builder
    what: Measure in NICOS, then build the model of a Bragg edge with a model builder.
    mission: >-
      Fyrø will check every steel delivery for its turbine foundations, without cutting a plate. Build the analysis of
      a Bragg edge and give the verdict on a first plate, with its uncertainty.
    duration: 3 hours
    open: lab
    file: odin/exercises/iron_bragg_edges/ODIN_iron_msc.ipynb
  beamtime:
    label: Beamtime with NICOS
    what: Drive ODIN in NICOS, choose your own measurements, analyze your files.
    mission: >-
      Your proposal was accepted: before Fyrø's steel components are measured, show that ODIN measures the plane
      spacing of a reference iron plate reliably. You plan and run the beamtime.
    duration: 1 day
    open: lab
    file: odin/exercises/iron_bragg_edges/beamtime.md
    nicos: odin
    analysis: odin/exercises/iron_bragg_edges/ODIN_iron_beamtime.ipynb
    # the proposal of this beamtime, in the user office of the twin (user_office.py): Find my proposal in the Experiment tab
    # of NICOS; its samples are those of the exercise, the first one mounted by default
    proposal: {id: "1234", title: "Lattice spacing of a ferritic steel component by Bragg-edge imaging"}

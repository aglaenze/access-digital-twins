# One exercise of the catalogue of the app (read by container/twin_app.py: no generation needed).
title: Unknown metals (game)
number: "0 bis"              # the challenge that goes with exercise 0
instrument: odin
technique: Wavelength-resolved imaging (Bragg edges)
sample: Three metal plates labeled A, B, C
question: >-
  Identify three unknown metal plates and measure their lattice parameter, within a limited beamtime budget (score).
  Mission 2: the instrument has a hidden fault; find it from the data.

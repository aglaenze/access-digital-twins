# Generated by gen_templates.py: an example of the sample builder (a samplecraft recipe).
name: martian_breccia
instrument: odin
title: Martian breccia (like NWA 7034)
description: 'A sawn piece (8 × 12 × 2 mm) of a Martian breccia: the fine matrix of NWA 7034 (its Σ measured at ICON), clasts
  of plagioclase and pyroxene (5 % each), Fe-Ti oxide grains, pores, and hydrated clasts (a goethite body with a magnetite
  grain, a component) gathered in 6 clusters.'
recipe:
  samplecraft: 1
  seed: 7
  provenance:
    sources: ['Naver et al., arXiv:2601.08390 (2026)']
    assumptions: [positions random (seed 7), 'clast shape: one component, scaled 0.6 to 1.4']
  materials:
    matrix:
      calibrate:
        base:
          minerals: {plag: 38, opx: 25.4, cpx: 18.2, mag: 9.7, afs: 4.9, ap: 3.7}
        add: water
        sigma_cm: 0.45
        wavelength_A: 1.8
      source: Naver et al., arXiv:2601.08390, Table S2 (matrix at ICON); mineralogy of Agee et al. 2013
    plagioclase:
      minerals: {plag: 85, afs: 15}
    pyroxene:
      minerals: {opx: 58, cpx: 42}
    goethite:
      minerals: {gt: 100}
    Fe-Ti oxide:
      minerals: {mag: 65, ilm: 35}
    void: {ncrystal: void.ncmat}
    aluminium: {ncrystal: Al_sg225.ncmat, source: NCrystal library}
  components:
    hydrated clast:
      material: goethite
      shape:
        type: blob
        size: [0.25, 0.32, 0.27]
        wobble: 0.12
        seed: 3
      children:
      - name: magnetite grain
        material: Fe-Ti oxide
        shape:
          type: box
          size: [0.07, 0.07, 0.07]
          position: [-0.05, 0.0, 0.0]
          rotation:
            euler_deg: [20, 35, 10]
  bodies:
  - name: the piece
    material: matrix
    shape:
      type: sawn_piece
      size: [8, 12, 2]
      seed: 11
    fill:
    - use: hydrated clast
      count: 120
      scale: [0.6, 1.4]
      clusters: {count: 6, spread_mm: 0.35}
    - material: plagioclase
      fraction: 0.05
      size_mm: [0.1, 0.5]
      grain: {type: blob, wobble: 0.12}
    - material: pyroxene
      fraction: 0.05
      size_mm: [0.1, 0.5]
      grain: {type: blob, wobble: 0.12}
    - material: Fe-Ti oxide
      count: 800
      size:
        lognormal: {median_mm: 0.04, sigma: 0.5}
        min_mm: 0.016
        max_mm: 0.08
      aspect:
      - [0.6, 1]
      - [0.6, 1]
      grain: {type: blob, wobble: 0}
    - material: void
      count: 40
      size_mm: [0.06, 0.12]
      aspect:
      - [0.7, 1]
      - [0.7, 1]
      grain: {type: blob, wobble: 0.15}
      name: pore
  - name: aluminium pin
    material: aluminium
    holder: true
    shape:
      type: cylinder
      diameter: 3.0
      height: 6.0
      position: [0.0, -9.0, 0.0]

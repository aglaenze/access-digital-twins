# Step 1 of filewriter/README.md: build the ESS file-writer (kafka-to-nexus) from its sources, check that it runs,
# publish the image ghcr.io/aglaenze/access-digital-twins-filewriter. Long (a C++ build with its dependencies).
name: filewriter

on:
  push:
    branches: [main]
    paths: ["filewriter/**", ".github/workflows/filewriter.yml"]
  workflow_dispatch:
    inputs:
      ref:
        description: "kafka-to-nexus ref (tag or commit)"
        default: "main"

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    steps:
      - name: Free disk space on the runner
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          df -h /
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build kafka-to-nexus
        uses: docker/build-push-action@v6
        with:
          context: .
          file: filewriter/Containerfile
          load: true
          tags: filewriter:test
          build-args: K2N_REF=${{ github.event.inputs.ref || 'main' }}
          cache-from: type=gha,scope=filewriter
          cache-to: type=gha,mode=max,scope=filewriter
      - name: It runs
        run: |
          docker run --rm filewriter:test cat /opt/kafka-to-nexus/K2N_VERSION
          docker run --rm filewriter:test kafka-to-nexus --help > help.txt   # (fails here if it does not start)
          head -40 help.txt
      - name: Publish
        if: github.event_name != 'pull_request'
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker tag filewriter:test "ghcr.io/${{ github.repository }}-filewriter:latest"
          docker push "ghcr.io/${{ github.repository }}-filewriter:latest"
      # Steps 2 to 4: the twin's streams written by the file-writer, compared with the twin's own file (ODIN, LoKI).
      # A Kafka broker and kafka-to-nexus on the runner; filewriter/e2e_test.py plays the twin and NICOS.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # kafka-to-nexus logs only to syslog: /dev/log of the runner (journald) is given to its container
      - name: The twin with the file-writer, end to end
        run: |
          pip install --quiet h5py numpy "confluent-kafka>=2.14,<3" "ess-streaming-data-types>=0.27,<0.28" pooch ipywidgets essimaging esssans tof
          docker run -d --name kafka --network host \
            -e KAFKA_NODE_ID=1 -e KAFKA_PROCESS_ROLES=broker,controller \
            -e KAFKA_LISTENERS=PLAINTEXT://127.0.0.1:9092,CONTROLLER://127.0.0.1:9093 \
            -e KAFKA_ADVERTISED_LISTENERS=PLAINTEXT://127.0.0.1:9092 -e KAFKA_CONTROLLER_LISTENER_NAMES=CONTROLLER \
            -e KAFKA_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT \
            -e KAFKA_CONTROLLER_QUORUM_VOTERS=1@127.0.0.1:9093 -e KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR=1 \
            -e KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR=1 -e KAFKA_TRANSACTION_STATE_LOG_MIN_ISR=1 \
            -e KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS=0 -e KAFKA_NUM_PARTITIONS=1 \
            -e KAFKA_MESSAGE_MAX_BYTES=16777216 -e KAFKA_REPLICA_FETCH_MAX_BYTES=16777216 apache/kafka:3.9.1
          # the broker answers (metadata), not only its port open; its log if it does not
          kafka_up() { python -c "from confluent_kafka.admin import AdminClient; AdminClient({'bootstrap.servers': '127.0.0.1:9092'}).list_topics(timeout=5)" 2>/dev/null; }
          for i in $(seq 60); do kafka_up && break; sleep 3; done
          if ! kafka_up; then docker ps -a; docker logs kafka 2>&1 | tail -60; exit 1; fi
          echo "Kafka up"
          ODIN_SRC=$(python -c "import ess.odin.data as d; print(d.iron_simulation_ob_small())")
          LOKI_SRC=$(python -c "from ess.loki.data import loki_coda_file; print(loki_coda_file())")
          mkdir -p /tmp/fw
          status=0
          for instr in odin loki; do
            src=$ODIN_SRC; [ $instr = loki ] && src=$LOKI_SRC
            # its topics exist before it starts (it would not see a topic created after its subscription)
            python filewriter/e2e_test.py --create-topics ${instr}_filewriter ${instr}_filewriter_pool
            docker run -d --name fw_$instr --network host -v /tmp/fw:/tmp/fw -v /dev/log:/dev/log filewriter:test kafka-to-nexus \
              --brokers 127.0.0.1:9092 --command-status-topic ${instr}_filewriter \
              --job-pool-topic ${instr}_filewriter_pool --hdf-output-prefix / --hdf-template-prefix /tmp/fw/templates
            sleep 10
            echo "::group::$instr"
            timeout 900 python -u filewriter/e2e_test.py --root /tmp/fw --instrument $instr --src "$src" || status=1
            echo "--- file-writer"; docker ps -a --filter name=fw_$instr; docker logs fw_$instr 2>&1 | tail -60
            echo "--- its log (syslog only, no console output)"; sudo journalctl -t kafka-to-nexus --no-pager -o cat | grep -v -E 'WriterModule finished but no writes|constructor called' | tail -120; echo '(end of its log)'
            echo "--- messages on the topics of the file-writer"
            echo "(show-topics)"; timeout 120 python -u filewriter/e2e_test.py --show-topics ${instr}_filewriter ${instr}_filewriter_pool || echo "show-topics exit $?"
            kafka_up || { echo "--- Kafka is down:"; docker ps -a; docker logs kafka 2>&1 | tail -60; }
            echo "::endgroup::"
            docker stop -t 30 fw_$instr > /dev/null; docker rm -f fw_$instr   # stopped: it leaves its consumer group
          done
          exit $status

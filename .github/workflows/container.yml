# Builds the container image (container/Containerfile) for Intel/AMD (amd64) and ARM (arm64: Apple Silicon Macs, ARM
# servers), each on its own GitHub runner, runs the smoke test on both, publishes each image that passes
# (ghcr.io/aglaenze/access-digital-twins:latest-amd64, :latest-arm64), then joins them under :latest (Docker and Podman
# pick the right one). The amd64 image is required; arm64 is added when it passes.
name: container

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read      # checkout + download of the release assets (upstream McStas parts)
  packages: write     # push to ghcr.io

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  build-test-publish:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 180
    steps:
      - name: Free disk space on the runner
        # The image (McStas, two conda environments, NICOS) needs more than the ~20 GB left on a standard runner
        # during the build: remove preinstalled tools that are not used here (~30 GB).
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup \
                      /opt/hostedtoolcache/CodeQL /usr/local/share/boost /usr/local/share/powershell
          sudo docker image prune --all --force
          df -h /

      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build the image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: container/Containerfile
          load: true
          tags: twin:test
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}

      - name: Smoke test (tools, one measurement compared with NCrystal, NICOS services)
        run: |
          docker image ls twin:test
          df -h /
          docker run --rm -e GITHUB_TOKEN=${{ secrets.GITHUB_TOKEN }} -e TWIN_MPI=4 twin:test test

      - name: NICOS window on the desktop of the container (screenshot)
        run: |
          mkdir -p shots && chmod 777 shots
          docker run --rm -v "$PWD/shots:/data/shots" -e GITHUB_TOKEN=${{ secrets.GITHUB_TOKEN }} -e TWIN_MPI=4 twin:test bash container/desktop_test.sh /data/shots


      - uses: actions/setup-node@v4
        if: matrix.arch == 'amd64'
        with:
          node-version: 22

      - name: The app (Electron) with this image, container mode (self-test, screenshots)
        # does not block the publication of the image: the app is tested here, its installers are built by app.yml
        if: matrix.arch == 'amd64'
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash app/ci_selftest.sh twin:test "$PWD/shots/app"

      - name: Keep the screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots-${{ matrix.arch }}
          path: shots
          if-no-files-found: ignore

      - name: Log in to ghcr.io
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish (one tag per architecture)
        if: github.event_name != 'pull_request'
        run: |
          docker tag twin:test "$IMAGE:latest-${{ matrix.arch }}"
          docker tag twin:test "$IMAGE:${GITHUB_SHA::7}-${{ matrix.arch }}"
          docker push "$IMAGE:latest-${{ matrix.arch }}"
          docker push "$IMAGE:${GITHUB_SHA::7}-${{ matrix.arch }}"

  multi-arch:
    # :latest and :<commit> = the images of this commit that passed (amd64 required, arm64 if it passed)
    needs: build-test-publish
    if: always() && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Join the architectures under :latest
        run: |
          refs=""
          for a in amd64 arm64; do
            if docker buildx imagetools inspect "$IMAGE:${GITHUB_SHA::7}-$a" > /dev/null 2>&1; then
              refs="$refs $IMAGE:${GITHUB_SHA::7}-$a"; echo "image $a: ok"
            else
              echo "image $a: not published for this commit"
            fi
          done
          case "$refs" in *amd64*) ;; *) echo "the amd64 image is missing: :latest not changed"; exit 1 ;; esac
          docker buildx imagetools create -t "$IMAGE:latest" -t "$IMAGE:${GITHUB_SHA::7}" $refs

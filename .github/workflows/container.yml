# Builds the container image (container/Containerfile), runs its smoke test, and publishes it to the GitHub
# container registry (ghcr.io/aglaenze/access-digital-twins) when the test passes.
name: container

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read      # checkout + download of the release assets (upstream McStas parts)
  packages: write     # push to ghcr.io

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  build-test-publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - name: Free disk space on the runner
        # The image (McStas, two conda environments, NICOS) needs more than the ~20 GB left on a standard runner
        # during the build: remove preinstalled tools that are not used here (~30 GB).
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup \
                      /opt/hostedtoolcache/CodeQL /usr/local/share/boost /usr/local/share/powershell
          sudo docker image prune --all --force
          df -h /

      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build the image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: container/Containerfile
          load: true
          tags: twin:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test (tools, one measurement compared with NCrystal, NICOS services)
        run: |
          docker image ls twin:test
          df -h /
          docker run --rm -e GITHUB_TOKEN=${{ secrets.GITHUB_TOKEN }} -e TWIN_MPI=4 twin:test test

      - name: Log in to ghcr.io
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish
        if: github.event_name != 'pull_request'
        run: |
          docker tag twin:test "$IMAGE:latest"
          docker tag twin:test "$IMAGE:${GITHUB_SHA::7}"
          docker push --all-tags "$IMAGE"

# Exercises planned but not built yet: shown in the catalogue of the app without buttons ("in preparation"), or
# grayed (later: true). An exercise that is built has its own folder <instrument>/exercises/<name>/ with an
# exercise.yml (and the same number); remove it from here then.
# ODIN: seven themes covering the scope of the instrument (Strobl 2015: white-beam, Bragg-edge, diffraction-complemented,
# dark-field and polarized imaging), each with a realistic sample, ideally one already measured.
- number: "2"
  title: How does lithium enter a battery electrode?
  instrument: odin
  technique: Fast, operando imaging
  sample: Li-ion battery electrode during charge (graphite, LiC12, LiC6)
  question: Follow the lithium into the graphite electrode while the battery charges, image after image.
- number: "4"
  title: Where has the fuel-cell anode been reduced?
  instrument: odin
  technique: Phase mapping, phase transitions
  sample: Solid-oxide-cell anode support (NiO to Ni)
  question: Map where the nickel oxide has turned into nickel, from the Bragg edges of the two phases.
- number: "5"
  title: The crystals of an iron meteorite
  instrument: odin
  technique: Texture and grains (diffraction-complemented imaging)
  sample: Cape York iron meteorite (kamacite plates, taenite)
  question: Find the orientations of the large crystals of an iron meteorite.
  later: true
- number: "6"
  title: Structures smaller than a pixel
  instrument: odin
  technique: Dark-field imaging (gratings, SEMSANS)
  sample: A material with micrometer-sized structures
  question: See structures far smaller than the resolution of the camera, by the small-angle scattering they cause.
  later: true
- title: Small structures in a membrane
  instrument: loki
  technique: SANS, contrast variation
  question: Change the H2O/D2O ratio of the solvent to make parts of a sample invisible.
